# Builds the macOS application (RALibretro.app, Apple Silicon) for each push to the cross-platform branch and publishes
# it as a GitHub release holding one file, RALibretro-macOS.zip. The newest is the latest release, which this link
# always downloads: https://github.com/vhoxha08/RALibretro-Fork/releases/latest/download/RALibretro-macOS.zip
# Pull requests are only built.
name: macOS

on:
  push:
    branches:
      - cross-platform
  pull_request:
    branches:
      - cross-platform
  workflow_dispatch:

permissions:
  contents: write # the release

jobs:
  RALibretro-macOS:
    # the application runs on this version of macOS and later: Homebrew's SDL, which it bundles, is built for it
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        # the version comes from the tags (git describe)
        fetch-depth: 0

    - name: Fetch RAIntegration's tags
      run: git -C src/RAIntegration fetch --quiet --tags origin

    - name: Install dependencies
      run: brew install ninja sdl2-compat

    - name: Configure
      run: cmake -B build-release.noindex -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET

    - name: Build
      run: ninja -C build-release.noindex RALibretro

    - name: Package
      run: |
        # ditto keeps the bundle's permissions and signature
        ditto -c -k --keepParent build-release.noindex/RALibretro.app RALibretro-macOS.zip
        # only version tags, not the macos-... tags of the releases (see CMakeLists.txt)
        echo "VERSION=$(git describe --tags --match '[0-9]*')" >> "$GITHUB_ENV"

    - name: Publish
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="macos-$VERSION"
        if gh release view "$tag" > /dev/null 2>&1; then
          # the same commit built again
          gh release upload "$tag" RALibretro-macOS.zip --clobber
        else
          gh release create "$tag" RALibretro-macOS.zip --target "$GITHUB_SHA" --latest \
            --title "macOS build $VERSION" \
            --notes "RALibretro for macOS 15 or later on Apple Silicon, built from ${GITHUB_SHA::7} (branch cross-platform). Unzip RALibretro-macOS.zip and copy RALibretro.app to /Applications. It's signed ad hoc, so macOS refuses to open it the first time: open it, then allow it in System Settings → Privacy & Security (Open Anyway)."
        fi
