# Builds RALibretro for macOS (RALibretro.app, Apple Silicon), Linux (an AppImage, x86_64) and Windows (x64) for each
# push to the cross-platform branch, and publishes them in one GitHub release. The newest is the latest release, which
# these links always download:
#   https://github.com/vhoxha08/RALibretro-Fork/releases/latest/download/RALibretro-macOS.zip
#   https://github.com/vhoxha08/RALibretro-Fork/releases/latest/download/RALibretro-x86_64.AppImage
#   https://github.com/vhoxha08/RALibretro-Fork/releases/latest/download/RALibretro-Windows-x64.zip
# Pull requests are only built.
name: Build

on:
  push:
    branches:
      - cross-platform
  pull_request:
    branches:
      - cross-platform
  workflow_dispatch:

permissions:
  contents: write # the release

jobs:
  RALibretro-macOS:
    # the application runs on this version of macOS and later: Homebrew's SDL, which it bundles, is built for it
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # the version comes from the tags (git describe)
        fetch-depth: 0

    - name: Submodules
      run: |
        # without their history (i.e. wxWidgets' is large), except RAIntegration's: its version comes from its tags
        git submodule update --init --recursive --depth 1 --jobs 8
        git -C src/RAIntegration fetch --quiet --unshallow --tags origin

    - name: Install dependencies
      run: brew install ninja sdl2-compat ccache

    - name: Compiler cache settings
      run: |
        # the objects of unchanged sources (i.e. all of wxWidgets) come from the previous builds' (see the next step)
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
        # (RAIntegration's precompiled header)
        echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"
        # the compiler by its version, not its file: the runners' images (i.e. their macOS version) differ, and so does
        # the file's time, which made every object a miss
        echo "CCACHE_COMPILERCHECK=%compiler% --version" >> "$GITHUB_ENV"

    - name: Compiler cache
      uses: actions/cache@v6
      with:
        path: .ccache
        # a new one each run (a cache can't be updated), from the newest
        key: ccache-macOS-${{ github.run_id }}
        restore-keys: ccache-macOS-

    - name: Configure
      run: |
        # (-fno-pch-timestamp: Clang puts the time in a precompiled header, which made RAIntegration's objects misses)
        cmake -B build-release.noindex -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp"

    - name: Build
      run: |
        ninja -C build-release.noindex RALibretro
        ccache --show-stats

    - name: Package
      id: package
      run: |
        # ditto keeps the bundle's permissions and signature
        ditto -c -k --keepParent build-release.noindex/RALibretro.app RALibretro-macOS.zip
        # only version tags, not the build-... tags of the releases (see CMakeLists.txt)
        echo "version=$(git describe --tags --match '[0-9]*')" >> "$GITHUB_OUTPUT"

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: macOS
        path: RALibretro-macOS.zip

  RALibretro-Linux:
    runs-on: ubuntu-latest
    # an older Linux, so the AppImage runs on the Linux systems in use (it needs this one's glibc, 2.35, or later)
    container: ubuntu:22.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake ninja-build git pkg-config file curl \
          ca-certificates libgtk-3-dev libsdl2-dev libcurl4-openssl-dev libgl-dev libegl-dev libx11-dev \
          libwayland-dev wayland-protocols libxkbcommon-dev zlib1g-dev ccache \
          libgtk-3-bin adwaita-icon-theme # (the AppImage's icons: gtk-encode-symbolic-svg, Adwaita's)

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Submodules
      run: |
        # (the checkout belongs to another user than the container's)
        git config --global --add safe.directory '*'
        # without their history (i.e. wxWidgets' is large), except RAIntegration's: its version comes from its tags
        git submodule update --init --recursive --depth 1 --jobs 8
        git -C src/RAIntegration fetch --quiet --unshallow --tags origin

    - name: Compiler cache settings
      run: |
        # the objects of unchanged sources (i.e. all of wxWidgets) come from the previous builds' (see the next step)
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
        # (RAIntegration's precompiled header)
        echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"

    - name: Compiler cache
      uses: actions/cache@v6
      with:
        path: .ccache
        # a new one each run (a cache can't be updated), from the newest
        key: ccache-Linux-${{ github.run_id }}
        restore-keys: ccache-Linux-

    - name: Configure
      run: |
        cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: |
        ninja -C build-release RALibretro
        ccache --show-stats

    - name: Package
      id: package
      run: |
        etc/linux/make-appimage.sh build-release .
        echo "version=$(git describe --tags --match '[0-9]*')" >> "$GITHUB_OUTPUT"

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Linux
        path: RALibretro-x86_64.AppImage

  RALibretro-Windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Submodules
      shell: bash
      run: |
        # without their history, and without RAIntegration: the application downloads RA_Integration.dll itself
        git -c submodule.src/RAIntegration.update=none submodule update --init --recursive --depth 1 --jobs 8

    - name: Only version tags
      shell: bash
      run: |
        # RAInterface's MakeBuildVer.bat takes the closest tag, whatever its name: the version would be a release's
        # build-... tag (CMake makes the other builds look at version tags only, see CMakeLists.txt)
        git tag -l | grep -v '^[0-9]' | xargs -r git tag -d > /dev/null

    - name: Install MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build
      shell: bash
      run: |
        # (not in parallel: RAHasher needs the RA_BuildVer.h RALibretro's project makes first)
        if ! msbuild.exe RALibretro.sln -p:Configuration=Release -p:Platform=x64 -flp:"errorsonly;logfile=errors.log"; then
          # the errors as an annotation too: it can be read without a GitHub login, unlike the run's log (all of them in
          # one, as a step shows 10 annotations at most)
          echo "::error title=MSBuild::$(sed -E 's/^ *[0-9]+>//' errors.log | sort -u | head -n 60 | awk 'BEGIN { ORS = "%0A" } { print }')"
          exit 1
        fi

    - name: Package
      id: package
      shell: bash
      run: |
        # bin64: RALibRetro.exe, SDL2.dll, Cores/cores.json and the overlay (it downloads RA_Integration.dll itself)
        mkdir RALibretro && cp -r bin64/* RALibretro/
        7z a -bd RALibretro-Windows-x64.zip RALibretro > /dev/null
        echo "version=$(git describe --tags --match '[0-9]*')" >> "$GITHUB_OUTPUT"

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Windows
        path: RALibretro-Windows-x64.zip

  Publish:
    # as soon as one of them built (i.e. GitHub had no macOS machine for another): the release then has the previous
    # release's file for the others, so the latest release always has them all (the links above keep working)
    if: >-
      always() && github.event_name != 'pull_request' && (needs.RALibretro-macOS.result == 'success' ||
      needs.RALibretro-Linux.result == 'success' || needs.RALibretro-Windows.result == 'success')
    needs: [RALibretro-macOS, RALibretro-Linux, RALibretro-Windows]
    runs-on: ubuntu-latest
    steps:
    - name: Download
      uses: actions/download-artifact@v8

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.RALibretro-macOS.outputs.version || needs.RALibretro-Linux.outputs.version || needs.RALibretro-Windows.outputs.version }}
      run: |
        tag="build-$VERSION"
        files=()
        missing=()
        for file in macOS/RALibretro-macOS.zip Linux/RALibretro-x86_64.AppImage Windows/RALibretro-Windows-x64.zip; do
          if [ -f "$file" ]; then
            files+=("$file")
          else
            missing+=("$(basename "$file")")
          fi
        done

        if gh release view "$tag" > /dev/null 2>&1; then
          # the same commit built again: what built replaces the release's file (a carried-over one too)
          gh release upload "$tag" "${files[@]}" --clobber
          exit 0
        fi

        # what didn't build: the latest release's
        previous="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
        carried=""
        for name in "${missing[@]}"; do
          if [ -n "$previous" ] && gh release download "$previous" --pattern "$name" --dir carried; then
            files+=("carried/$name")
            carried="$carried
        - $name couldn't be built for this release: it's the one of the previous release, $previous."
          fi
        done

        cat > notes.md <<EOF
        RALibretro (fork) built from ${GITHUB_SHA::7} (branch cross-platform).

        - **macOS** 15 or later on Apple Silicon: RALibretro-macOS.zip. Unzip it and copy RALibretro.app to /Applications. It's signed ad hoc, so macOS refuses to open it the first time: open it, then allow it in System Settings → Privacy & Security (Open Anyway).
        - **Linux** x86_64: RALibretro-x86_64.AppImage. Make it executable (chmod +x) and run it. It uses Wayland when there is one.
        - **Windows** x64: RALibretro-Windows-x64.zip. Unzip it and run RALibretro\\RALibRetro.exe; it downloads RA_Integration.dll (the official one) when it starts.
        $carried
        EOF
        gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --latest --title "Build $VERSION" --notes-file notes.md
